spring:
  application:
    name: hvac-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hvac_local}
    username: ${DB_USERNAME:hvac_local}
    password: ${DB_PASSWORD:change-me-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  tracking-ttl-days: ${TRACKING_TTL_DAYS:30}
