services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hvac_local
      POSTGRES_USER: ${DB_USERNAME:-hvac_local}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hvac_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hvac_local} -d hvac_local"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hvac_pg:
